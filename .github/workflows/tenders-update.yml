name: Обновление закупок и аудит ЭТП

# Надёжность по образцу cam-ufa: не один cron, а несколько окон запуска.
# Первый сработавший собирает данные, остальные выходят без запросов
# (идемпотентность в collect-tenders.js). Резервные окна страхуют задержку
# GitHub cron, которая однажды уже составила 7 часов.
on:
  # GitHub Actions не гарантирует запуск в точное время: 03:00 UTC однажды
  # сработало в 18:37 UTC. Поэтому частые окна + идемпотентность: первый
  # сработавший собирает данные, остальные выходят без единого запроса.
  schedule:
    - cron: '*/15 2-12 * * 1-5'   # 05:00–15:45 МСК, каждые 15 минут, рабочие дни
    - cron: '0 16 * * 1-5'        # 19:00 МСК — последний шанс собрать в тот же день
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      ran: ${{ steps.collected.outputs.ran }}
    steps:
      # ВАЖНО: брать свежий main, а не SHA, который вызвал workflow.
      # Иначе запуск из очереди concurrency начнётся с устаревшего коммита,
      # снова соберёт данные и не сможет сделать push (non-fast-forward).
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Архив НЕ лежит в git. Берём последнюю публикацию main и переносим
      # data/archive/ в текущую сборку — иначе архив начинался бы с нуля.
      - name: Восстанавливаем архив снимков
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/archive.js restore

      - name: Сбор закупок и проверка ЭТП
        run: node scripts/collect-tenders.js --limit=2000

      - name: Проверяем, был ли сбор
        id: collected
        run: |
          echo "ran=$(node -e "console.log(JSON.parse(require('fs').readFileSync('data/last-collect-result.json','utf8')).ran)")" >> "$GITHUB_OUTPUT"

      - name: Обновление манифеста версии и метки запуска
        if: steps.collected.outputs.ran == 'true'
        run: |
          node -e "
            const fs=require('fs');
            const p=JSON.parse(fs.readFileSync('version.json','utf8'));
            const m=String(p.version||'2.46.0').match(/^(\d+)\.(\d+)/);
            const major=m?Number(m[1]):2, minor=m?Number(m[2]):46;
            p.version=major+'.'+minor+'.'+new Date().toISOString().replace(/[-:T]/g,'').slice(0,12);
            p.date=new Date().toISOString().slice(0,10);
            p.title='Энергореестр РФ — обновление закупок';
            p.message='Данные закупок обновлены. Страница перезагрузится автоматически.';
            fs.writeFileSync('version.json',JSON.stringify(p,null,2)+'\n');
          "
          date -u +%F > last-run.txt

      - name: Пересборка данных сайта
        if: steps.collected.outputs.ran == 'true'
        run: node build.js

      - name: Добавляем снимок в архив и чистим старое
        if: steps.collected.outputs.ran == 'true'
        run: |
          node scripts/archive.js snapshot
          node scripts/archive.js prune
          node scripts/archive.js reindex
          echo "Снимков в архиве: $(node -e "console.log(JSON.parse(require('fs').readFileSync('data/archive/index.json','utf8')).snapshots.length)")"

      - name: Сохраняем состояние в репозиторий
        if: steps.collected.outputs.ran == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Сначала коммитим, затем подтягиваем свежий main и ребейзимся на него.
          # Если другой запуск уже закоммитил данные — берём его состояние и
          # продолжаем публикацию без повторного сбора.
          git add -A
          if git diff --cached --quiet; then
            echo "Изменений нет — пропускаем коммит"
          else
            git commit -m "tenders: automate collection $(date -u +%Y-%m-%dT%H:%MZ)"
          fi
          git fetch origin main
          if ! git rebase origin/main; then
            git rebase --abort || true
            echo "Конкурирующий запуск уже обновил данные — используем его состояние"
            git reset --hard origin/main
            exit 0
          fi
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then break; fi
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              git reset --hard origin/main
              break
            fi
            sleep $((attempt * 5))
          done

      - name: Готовим сайт к публикации
        if: steps.collected.outputs.ran == 'true'
        run: |
          mkdir -p _site/data/archive
          cp index.html log.html archive.html demo-new.html print.html robots.txt version.json _site/
          cp -r css js _site/
          # Публикуем только нужные браузеру данные. Исследования и исходники
          # реестра (с телефонами сотрудников) на Pages не попадают.
          cp data/visits-config.json data/collect-log.json _site/data/
          cp -r data/archive/. _site/data/archive/ 2>/dev/null || true

      - uses: actions/configure-pages@v5
        if: steps.collected.outputs.ran == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.collected.outputs.ran == 'true'
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.ran == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
