name: Обновление закупок и аудит ЭТП

# Сбор — ТОЛЬКО по расписанию и вручную. Триггера push нет: раньше каждый
# коммит запускал полный сбор и сжигал квоты. Публикация артефактом (как в
# cam-ufa): архив снимков восстанавливается из прошлой публикации Pages,
# добавляется сегодняшний снимок, старые удаляются. Всё живёт на GitHub.
on:
  schedule:
    # 06:00 по Москве = 03:00 UTC. GitHub часто задерживает cron — внутри
    # скрипта есть гейт нерабочих дней и инкрементальное окно.
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Архив НЕ лежит в git. Берём последнюю публикацию main и переносим
      # data/archive/ в текущую сборку — иначе архив каждый раз начинался бы с нуля.
      - name: Восстанавливаем архив снимков
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/archive.js restore

      - name: Сбор закупок и проверка ЭТП
        run: node scripts/collect-tenders.js --limit=2000

      - name: Обновление манифеста версии и метки запуска
        run: |
          node -e "
            const fs=require('fs');
            const p=JSON.parse(fs.readFileSync('version.json','utf8'));
            p.version='2.9.'+new Date().toISOString().replace(/[-:T]/g,'').slice(0,12);
            p.date=new Date().toISOString().slice(0,10);
            p.title='Энергореестр РФ — обновление закупок';
            p.message='Данные закупок обновлены. Страница перезагрузится автоматически.';
            fs.writeFileSync('version.json',JSON.stringify(p,null,2)+'\n');
          "
          date -u +%F > last-run.txt

      - name: Пересборка данных сайта
        run: node build.js

      - name: Добавляем снимок в архив и чистим старое
        run: |
          node scripts/archive.js snapshot
          node scripts/archive.js prune
          node scripts/archive.js reindex
          echo "Снимков в архиве: $(node -e "console.log(JSON.parse(require('fs').readFileSync('data/archive/index.json','utf8')).snapshots.length)")"

      - name: Сохраняем состояние в репозиторий
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Изменений нет — пропускаем коммит"
          else
            git commit -m "tenders: automate collection $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin HEAD:main
          fi

      - name: Готовим сайт к публикации
        run: |
          mkdir -p _site
          cp index.html log.html archive.html print.html robots.txt version.json _site/
          cp -r css js data _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
