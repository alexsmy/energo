name: Пересборка и публикация сайта

# Push НЕ запускает сбор закупок (он только в tenders-update.yml по расписанию).
# Здесь детерминированная пересборка артефактов из уже собранных данных.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Восстанавливаем архив снимков
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/archive.js restore

      - name: Пересборка данных сайта
        run: node build.js

      # Push через GITHUB_TOKEN не запускает workflow повторно — это
      # предотвращает бесконечный цикл push → build → push.
      - name: Сохраняем пересобранные файлы
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Изменений нет — пропускаем коммит"
          else
            git commit -m "build: пересборка данных сайта"
            git push origin HEAD:main
          fi

      - name: Готовим сайт к публикации
        run: |
          mkdir -p _site/data/archive
          cp index.html log.html archive.html demo-new.html print.html robots.txt version.json _site/
          cp -r css js _site/
          # Только данные, которые читает браузер. research-логи и entities.tsv
          # не публикуются: там могут быть личные телефоны сотрудников.
          cp data/visits-config.json data/collect-log.json _site/data/
          cp -r data/archive/. _site/data/archive/ 2>/dev/null || true

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
