name: Точечная проверка площадки

# Один запрос к одной площадке из инфраструктуры GitHub — без сбора данных.
# Нужно, чтобы понять, помогают ли браузерные заголовки/куки именно с IP Actions.
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Площадка для проверки'
        required: true
        default: tektorg
        type: choice
        options:
          - tektorg
          - gpb
          - roseltorg
          - eis
          - gosplan
          - gentender

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Один запрос
        run: node scripts/probe-one.js --target=${{ inputs.target }}
