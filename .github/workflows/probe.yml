name: Точечная проверка площадки

# Один запрос к одной площадке из инфраструктуры GitHub — без сбора данных.
# Нужно, чтобы понять, помогают ли браузерные заголовки/куки именно с IP Actions.
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Площадка для проверки'
        required: true
        default: tektorg
        type: choice
        options:
          - tektorg
          - gpb
          - roseltorg
          - eis
          - gosplan
          - gentender

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Один запрос
        env:
          TARGET: ${{ inputs.target }}
        run: node scripts/probe-one.js --target="$TARGET"
